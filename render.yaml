services:
  - type: web
    name: afrigen-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: worker
    name: afrigen-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
