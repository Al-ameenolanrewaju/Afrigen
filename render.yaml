services:
  - type: web
    name: afrigen
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # NOTE: the daily blog-draft generator is NOT a separate (paid) cron service.
  # It runs in-process on the web service above via an APScheduler task in app.py
  # (generate_daily_blog_draft, 7am daily) — exactly like the weekly newsletter.
  # That web service already has GROQ_API_KEY and DATABASE_URL in its env, so
  # there is nothing extra to configure and no extra cost.
