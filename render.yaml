services:
  - type: web
    name: afrigen
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Daily blog-draft generator. Writes ONE draft to the shared database, which
  # an admin then reviews/publishes at /admin/blog. It never publishes itself.
  # Schedule is UTC. "0 7 * * *" = 07:00 UTC daily (~08:00 West Africa Time).
  # To change the time, edit the `schedule` line below (standard cron, UTC).
  - type: cron
    name: afrigen-blog-draft
    env: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/generate_blog_draft.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Secrets — NOT committed. Paste these in the Render dashboard for THIS
      # cron service (Environment tab). sync: false keeps them out of git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
