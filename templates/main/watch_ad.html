{% extends "base.html" %}

{% block title %}Unlock your download{% endblock %}

{% block content %}
<main class="mx-auto my-5" style="max-width: 620px;">
    <section class="p-4 p-md-5 rounded-4 text-center" style="background: var(--af-surface, #141414); border: 1px solid var(--af-border, #303030);">
        <span class="badge-gold mb-3"><i class="fa-solid fa-circle-play me-2" aria-hidden="true"></i>DOWNLOAD ACCESS</span>
        <h1 class="h3 text-white mt-3">Unlock your download</h1>
        <p class="text-secondary mb-4">Watch a short ad to download your generated video.</p>

        <div class="p-4 rounded-3 mb-4" style="background: var(--af-obsidian, #090909); border: 1px solid var(--af-border, #303030);" role="status">
            <i class="fa-solid fa-rectangle-ad text-warning me-2" aria-hidden="true"></i>
            Ad will appear here
        </div>

        <form method="POST" action="{{ url_for('main.unlock_download', generation_id=generation.id) }}">
            <button type="submit" class="btn btn-gold">
                I watched the ad <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i> Download video
            </button>
        </form>
    </section>
</main>
{% endblock %}
