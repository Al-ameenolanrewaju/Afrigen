{% extends "base.html" %}
{% block title %}Offline — Afrigen AI{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div style="max-width: 500px; margin: 40px auto; padding: 40px 24px; background: #161B22; border: 1px solid #30363D; border-radius: 16px;">
        <div style="font-size: 64px; color: #F5A623; margin-bottom: 20px;">
            <i class="fa-solid fa-wifi"></i>
        </div>
        <h2 style="color: #F0F6FC; font-weight: 700; margin-bottom: 12px;">You're Offline</h2>
        <p style="color: #8B949E; font-size: 15px; line-height: 1.6; margin-bottom: 28px;">
            It looks like you've lost your internet connection. Afrigen needs an active network to communicate with our AI video and image models.
        </p>
        <button onclick="window.location.reload();" class="btn btn-warning px-4 py-2" style="background: #F5A623; border: none; color: #0D1117; font-weight: 600; border-radius: 8px;">
            <i class="fa-solid fa-rotate-right me-2"></i> Try Again
        </button>
    </div>
</div>
{% endblock %}
