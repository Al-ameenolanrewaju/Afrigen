{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h1 class="text-center mb-4" style="color: #F5A623; font-size: 1.75rem;">
                <i class="fa-solid fa-key"></i> Forgot Password
            </h1>
            <p class="text-center" style="color: #C9D1D9;">
                Enter your email and we'll send you a reset link!
            </p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email"
                           class="form-control" required>
                </div>
                <button type="submit" class="btn btn-afrigen w-100">
                    Send Reset Link <i class="fa-solid fa-envelope"></i>
                </button>
            </form>

            <p class="text-center mt-3">
                Remember your password?
                <a href="{{ url_for('auth.login') }}" style="color: #F5A623;">
                    Login here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
