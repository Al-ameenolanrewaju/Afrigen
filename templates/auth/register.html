{% extends "base.html" %}

{% block title %}Create Account | Afrigen 2.0{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card-surface p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="metric-icon-box mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <h1 class="h3 fw-bold text-white mb-1">Create Your Account</h1>
                <p class="small text-secondary mb-0">Join African creators producing cinema &amp; visuals</p>
            </div>

            <!-- Google OAuth -->
            <a href="{{ url_for('auth.google_login') }}" class="btn btn-surface w-100 mb-3 justify-content-center">
                <img src="https://www.google.com/favicon.ico" width="18" alt="Google">
                <span>Sign up with Google</span>
            </a>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1" style="border-color: var(--af-border);">
                <span class="px-3 small text-muted text-uppercase" style="font-size: 11px;">or email</span>
                <hr class="flex-grow-1" style="border-color: var(--af-border);">
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="yourname" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2">Get Started Free</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--af-border) !important;">
                <p class="small text-secondary mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-warning fw-bold">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
