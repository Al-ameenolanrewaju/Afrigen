{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4" style="color: #F5A623;">
                🔑 Reset Password
            </h2>
            <p class="text-center" style="color: #C9D1D9;">
                Enter your new password below!
            </p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="password"
                           class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password"
                           class="form-control" required>
                </div>
                <button type="submit" class="btn btn-afrigen w-100">
                    Reset Password 🔑
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
