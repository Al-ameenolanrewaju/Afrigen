{% extends "base.html" %}

{% block title %}Coming Soon — Afrigen{% endblock %}

{% block content %}
<div class="container text-center" style="margin-top: 100px; margin-bottom: 100px;">
    <h1 style="color: #F5A623; font-size: 3rem; margin-bottom: 20px;">
        <i class="fa-solid fa-person-digging"></i> Coming Soon
    </h1>
    <p style="color: #C9D1D9; font-size: 1.25rem;">
        This feature is currently under development. Stay tuned!
    </p>
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-afrigen mt-4">Go to Dashboard</a>
    {% else %}
        <a href="{{ url_for('main.index') }}" class="btn btn-afrigen mt-4">Go to Homepage</a>
    {% endif %}
</div>
{% endblock %}
